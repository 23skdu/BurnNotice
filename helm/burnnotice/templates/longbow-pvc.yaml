{{- if and .Values.longbow.enabled .Values.longbow.storage.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "burnnotice.fullname" . }}-longbow
  labels:
    {{- include "burnnotice.labels" . | nindent 4 }}
    app.kubernetes.io/component: longbow
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.longbow.storage.storageClass }}
  storageClassName: {{ .Values.longbow.storage.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.longbow.storage.size }}
{{- end }}
