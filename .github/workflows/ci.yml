name: CI & Quality Gates

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gates:
    name: Lint, Test, Accuracy & Oracle Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Format & Vet check
        run: |
          make fmt-check
          make vet
          make vet-cross-platform

      - name: Security & Lint
        run: |
          make lint
          make security

      - name: Unit & Race tests
        run: make test-race

      - name: Coverage Gate
        run: make test-coverage-gate

      - name: Accuracy Gate (internal/ invariants, CKA, calibration, thresholds)
        run: make accuracy-gate

      - name: Oracle Gate (deterministic golden tests, -count=2)
        run: make oracle-gate

      - name: CPU & Memory Profiling Gate
        run: |
          make profile
          bash scripts/bench-regression.sh docs/benchmarks/baseline.txt 25

      - name: Fuzz Smoke Gate
        run: make test-fuzz FUZZ_TIME=1

      - name: Generate Release Evidence Bundle
        run: make release-evidence

      - name: Upload Release Evidence Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-bundle
          path: |
            dist/evidence/**
            benchmark_results.txt
          if-no-files-found: warn

  lean-verification:
    name: Lean 4 Formal Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install Lean toolchain
        run: |
          cd lean
          elan toolchain install "$(cat lean-toolchain)"
          lake update

      - name: Build proofs
        run: |
          cd lean
          lake build

